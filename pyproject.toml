[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pan-bie-qi"
version = "1.2.0"
description = "Evidence-based assessment of public Agent Skill links"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "pdfplumber>=0.11.9,<0.12",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
pan-bie-qi = "skill_discriminator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_discriminator = ["data/*", "web/*"]
